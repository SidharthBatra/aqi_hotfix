name: Hourly Feature Pipeline

# Fetches the latest pollutant readings and pushes one new row into the
# Hopsworks feature group (aqi_karachi_features) that train_model.py
# trains from. Stateless by design -- see fetch_features.py's docstring
# for how it reconstructs recent context from Hopsworks itself rather
# than relying on local files, which wouldn't survive between runs here.
#
# Place this file at: .github/workflows/feature_pipeline.yml

on:
  schedule:
    # Hourly, UTC. Deliberately NOT "0 * * * *" -- GitHub's own docs warn
    # that the top of every hour is the highest-load instant for Actions
    # schedules and queued runs can be silently dropped under load, with no
    # failure/notification anywhere. INCIDENT (2026-09-01): with this cron
    # at :00, the schedule trigger fired successfully exactly ONCE in the
    # ~5 days after this workflow was added (2026-08-26 to 2026-09-01) --
    # confirmed via the Actions API run history, which showed only 1
    # `schedule`-triggered run out of 5 total (the rest were manual
    # workflow_dispatch runs used for testing). That single dropped-cron
    # problem, stacked with the timestamp-flooring bug fixed in
    # fetch_features.py the same day, is why the feature group only ever
    # had 4 live rows despite the pipeline reporting green. Running at :17
    # instead avoids the contended top-of-hour slot.
    - cron: "17 * * * *"
  workflow_dispatch: {}  # manual trigger from the Actions tab, for testing

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          AQICN_API_TOKEN: ${{ secrets.AQICN_API_TOKEN }}
        run: python fetch_features.py
